<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">          <!-- Die Seite sieht auf Smartphones richtig aus -->
    <title>Wetter-App</title>                                   <!-- Name des Browser-Tabs -->

    <link rel="stylesheet" href="style.css">                    <!-- Verbindet die CSS-Datei -->
</head>

<body>
    <!-- Titel -->
    <h1>Wetter-App</h1>

    <!-- suchleiste -->
    <div id="search_bar">
        <input id="city_name" placeholder="Stadtname">
        <button id="search_button">Suchen</button>

    </div>
         <div id="city_suggestions"></div>

    <!-- Wetteranzeige Wichtig-->
    <div id="weather_info">
        <h2 id="city"></h2>


        <p id="temperature"></p>
        <p id="feels_like"></p>
        <p id="weather"></p>
        <p id="rain"></p>
    </div>

    <!-- Sonneninfo -->
    <div id="sun_info">
    <div id="sunrise_box">
        <p class="sun_icon sunrise_icon">🌅</p>
        <p id="sunrise"></p>
    </div>

     <div id="sunnoon_box">
         <p class="sun_icon sunnoon_icon">☀️</p>
        <p id="sunnoon"></p>
     </div>

    <div id="sunset_box">
         <p class="sun_icon sunset_icon">🌇</p>
        <p id="sunset"></p>
    </div>

</div>

    <!-- Stündliche anzeige -->
     <div id="hourly_weather">
        <div class="hour_card">
        <p>test</p>
        <p>test</p>
        <p>☀️</p>
        </div>
    </div>

    <!-- Wetteranzeige details-->
     <div id="weather_details">
         <h3 id="details"></h3>

         <p id="humidity"></p>
         <p id="wind"></p>
         <p id="wind_direction"></p>
         <p id="air_quality"></p>

         <details>                                              <!-- details = kompletter ausklappbarer Bereich -->
        <summary>Luftqualitätsindex (AQI) Erklärung</summary>   <!-- summary = klickbare Überschrift des Ausklappbereichs -->
        <p>
            AQI = Air Quality Index<br><br>                     <!-- <br> = zeilenumbruch -->
            1 = Gut 🟢<br>
            2 = Fair 🟡<br>
            3 = Mäßig 🟠<br>
            4 = Schlecht 🔴<br>
            5 = Sehr schlecht 🟣
        </p>

        </details>
    </div>

    <script src="main.js"></script>
</body>

</html>
